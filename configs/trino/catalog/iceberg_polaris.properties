# Iceberg Catalog Configuration for Trino via Apache Polaris REST Catalog
# Purpose: Alternative to Hive Metastore for Iceberg table management
# Catalog: Apache Polaris (Iceberg REST catalog spec)
# Storage: MinIO object storage

# === Connector Configuration ===
connector.name=iceberg

# === Catalog Type ===
# Using REST catalog (Polaris implements the Iceberg REST catalog spec)
iceberg.catalog.type=rest

# === REST Catalog Connection ===
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=benchmark

# === S3 Configuration (MinIO) ===
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
hive.s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
hive.s3.region=us-east-1
hive.s3.ssl.enabled=false

# === Iceberg Table Properties ===
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# === Performance Tuning ===
# REST catalog has built-in metadata caching
iceberg.max-partitions-per-writer=100
iceberg.minimum-assigned-split-weight=0.05

# === Query Optimization ===
iceberg.pushdown-filter-enabled=true
iceberg.extended-statistics.enabled=true

# === Time Travel ===
iceberg.time-travel-enabled=true

# === Schema Evolution ===
iceberg.schema-evolution.enabled=true

# === Warehouse Location ===
iceberg.catalog.warehouse=s3://warehouse/
